[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "securefetch"
version = "0.1.0"
description = "A small HTTPS client built on the Python standard library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rukioyuza" }]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
